<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; border-radius: 5px; }
        .email-header { border-bottom: 2px solid #ff8700; padding-bottom: 10px; margin-bottom: 20px; color: #ff8700; }
        .email-footer { margin-top: 30px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1>My Blog Notification</h1>
        </div>
        
        <div class="email-content">
            <f:render section="Main" />
        </div>
        
        <div class="email-footer">
            &copy; <f:format.date format="Y">now</f:format.date> My Blog. All rights reserved.
        </div>
    </div>
</body>
</html>
