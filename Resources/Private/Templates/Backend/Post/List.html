<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:blog="http://typo3.org/ns/NitsanAi/MyBlog/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{pageId} == 0">
    <f:then>
        <f:be.infobox title="Select a Page" state="info">
            <f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.no_page_selected" />
        </f:be.infobox>
    </f:then>
    <f:else>
        <f:if condition="{posts}">
            <f:then>
                <h1><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.title" /></h1>
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.title" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.description" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.author" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.categories" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.comments" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.readingTime" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.views" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.created" /></th>
                                <th><f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.th.edited" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{posts}" as="post">
                                <tr>
                                    <td><strong>{post.title}</strong></td>
                                    <td>
                                        <f:if condition="{post.description}">
                                            <a href="#" data-bs-toggle="modal" data-bs-target="#descriptionModal-{post.uid}" title="View full description" class="text-decoration-none" style="border-bottom: 1px dashed;">
                                                <f:format.crop maxCharacters="15" append="..."><f:format.stripTags>{post.description}</f:format.stripTags></f:format.crop>
                                            </a>
                                            
                                            <div class="modal fade" id="descriptionModal-{post.uid}" tabindex="-1" aria-labelledby="descriptionModalLabel-{post.uid}" aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <div class="modal-header justify-content-between">
                                                            <h5 class="modal-title" id="descriptionModalLabel-{post.uid}">{post.title}</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <div class="modal-body text-wrap text-start" style="white-space: normal;">
                                                            <f:sanitize.html>{post.description}</f:sanitize.html>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </f:if>
                                    </td>
                                    <td>{post.author}</td>
                                    <td>
                                        <f:if condition="{post.categories}">
                                            <f:then>
                                                <f:for each="{post.categories}" as="category">
                                                    <span class="badge badge-primary">{category.title}</span>
                                                </f:for>
                                            </f:then>
                                            <f:else>
                                                <span class="text-muted">-</span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>{post.commentCountTotal}</td>
                                    <td>{post.readingTime} min</td>
                                    <td>{post.views}</td>
                                    <td><f:format.date format="d M Y, H:i">{post.crdate}</f:format.date></td>
                                    <td>
                                        <f:if condition="{blog:hasBeenEdited(created: post.crdate, updated: post.tstamp)}">
                                            <f:then><f:format.date format="d M Y, H:i">{post.tstamp}</f:format.date></f:then>
                                            <f:else><span class="text-muted">-</span></f:else>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox title="No Posts Found" state="warning">
                    <f:translate key="LLL:EXT:my_blog/Resources/Private/Language/locallang_mod.xlf:module.no_posts_found" />
                </f:be.infobox>
            </f:else>
        </f:if>
    </f:else>
</f:if>

</html>
