<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="container mt-4">
    <div class="card">
        <f:if condition="{post.image}">
            <f:then>
                <f:image class="card-img-top" image="{post.image}" alt="{post.title}" width="900" />
            </f:then>
        </f:if>
        <div class="card-body">
            <h2 class="card-title">{post.title}</h2>
            <p class="card-subtitle mb-3 text-muted">By {post.author}</p>
            <div class="card-text">
                <f:format.nl2br>{post.description}</f:format.nl2br>
            </div>
            <div class="mt-4">
                <f:link.action action="list" class="btn btn-secondary">← Back to Posts</f:link.action>
            </div>
        </div>
    </div>
</div>

</html>
