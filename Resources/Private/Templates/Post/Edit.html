<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="container mt-4">
    <h2>Edit Post: {post.title}</h2>

    <f:flashMessages />

    <f:form action="update" name="post" object="{post}" class="mt-3" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <f:form.textfield property="title" id="title" required="true" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">Author</label>
            <f:form.textfield property="author" id="author" required="true" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <f:form.textarea property="description" id="description" rows="5" required="true" class="form-control" />
        </div>

        <div class="d-flex gap-2">
            <div class="mb-3 w-100">
                <label for="image" class="form-label">Image (replace)</label>
                <f:form.upload property="image" id="image" accept=".jpg,.jpeg,.png" class="form-control" />
            </div>
            <f:form.submit value="Update Post" class="btn btn-primary" />
            <f:link.action action="list" class="btn btn-secondary">Cancel</f:link.action>
        </div>
    </f:form>
</div>

</html>
